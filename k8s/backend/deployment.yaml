apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: travel-memory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: your-docker-registry/travel-memory-backend:latest
        ports:
        - containerPort: 5000   # backend runs on 5000

        env:
        - name: MONGO_URL
          value: "mongodb://$(MONGO_INITDB_ROOT_USERNAME):$(MONGO_INITDB_ROOT_PASSWORD)@mongo:27017"
        - name: NODE_ENV
          value: "production"

        envFrom:
        - secretRef:
            name: travel-memory-secret

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"

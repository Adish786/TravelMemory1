apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: travel-memory
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: your-docker-registry/travel-memory-frontend:latest
        ports:
        - containerPort: 80

        envFrom:
        - configMapRef:
            name: travel-memory-config

        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "150m"
            memory: "128Mi"
